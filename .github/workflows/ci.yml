name: CI - Dependency & Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-backend:
    name: Backend Dependency & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Validate lockfile and install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit

  audit-frontend:
    name: Frontend Dependency & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate lockfile and install dependencies
        run: |
          cd frontend
          npm ci

      - name: Security audit
        run: |
          cd frontend
          npm audit
